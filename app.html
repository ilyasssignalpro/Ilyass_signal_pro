<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050806" />
  <title>PredictorPro</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050806; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 8%, rgba(34,197,94,.16), transparent 28rem),
        radial-gradient(circle at 85% 80%, rgba(16,185,129,.09), transparent 30rem),
        #050806;
    }
    #appFrame { width: 100%; height: 100%; border: 0; display: block; opacity: 0; transition: opacity .22s ease; background: #050806; }
    #appFrame.ready { opacity: 1; }
    #loader {
      position: fixed; inset: 0; display: grid; place-items: center; z-index: 10;
      background: rgba(5,8,6,.96); transition: opacity .22s ease, visibility .22s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-card { text-align: center; color: #f1f8f3; }
    .logo {
      width: 82px; height: 82px; border-radius: 999px; object-fit: cover;
      border: 2px solid rgba(74,222,128,.4); box-shadow: 0 0 0 8px rgba(34,197,94,.05), 0 18px 48px rgba(0,0,0,.4);
    }
    .spinner {
      width: 34px; height: 34px; margin: 22px auto 0; border-radius: 50%;
      border: 3px solid rgba(74,222,128,.14); border-top-color: #4ade80; animation: spin .8s linear infinite;
    }
    .loader-card p { margin: 14px 0 0; color: #9aaba0; font-size: 13px; letter-spacing: .02em; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader">
    <div class="loader-card">
      <img class="logo" src="images/PredictorPro.jpg" alt="PredictorPro" />
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading PredictorPro…</p>
    </div>
  </div>

  <iframe id="appFrame" src="main.html" title="PredictorPro application"></iframe>

  <script>
    const frame = document.getElementById('appFrame');
    const loader = document.getElementById('loader');

    function ensureStyle(doc, href, id) {
      if (doc.getElementById(id)) return;
      const link = doc.createElement('link');
      link.id = id;
      link.rel = 'stylesheet';
      link.href = href;
      doc.head.appendChild(link);
    }

    function modernizeCurrentPage() {
      try {
        const doc = frame.contentDocument;
        if (!doc || !doc.documentElement) return;

        doc.documentElement.classList.add('pp-modernized');
        ensureStyle(doc, 'styles/predictorpro-ui.css', 'pp-shared-ui');
        ensureStyle(doc, 'styles/app-modern.css', 'pp-app-modern-ui');

        // Keep navigation inside the modern app shell while preserving original links and scripts.
        doc.querySelectorAll('a[href]').forEach(link => {
          const href = link.getAttribute('href');
          if (!href || href.startsWith('#') || href.startsWith('http') || href.startsWith('mailto:') || href.startsWith('tel:')) return;
          link.setAttribute('target', '_self');
        });

        if (doc.title) document.title = doc.title;
        frame.classList.add('ready');
        loader.classList.add('hidden');
      } catch (error) {
        console.error('PredictorPro UI injection failed:', error);
        frame.classList.add('ready');
        loader.classList.add('hidden');
      }
    }

    frame.addEventListener('load', () => {
      frame.classList.remove('ready');
      loader.classList.remove('hidden');
      requestAnimationFrame(modernizeCurrentPage);
    });
  </script>
</body>
</html>
